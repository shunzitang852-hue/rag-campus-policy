version: rag-llm-provider-v1
provider: openai_compatible
base_url_env: LLM_BASE_URL
model_env: LLM_MODEL
api_key_env: DEEPSEEK_API_KEY
base_url: https://api.deepseek.com
model: deepseek-v4-flash
timeout_seconds: 60
temperature: 0.0
max_tokens: 512
request_options_json: {"thinking":{"type":"disabled"}}
notes: DeepSeek V4 Flash non-thinking smoke configuration. Secrets must never be stored in this file.
